services:
  nginx:
    image: nginx:alpine
    container_name: api-nginx
    ports:
      - "8092:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  image-nginx:
    image: nginx:alpine
    container_name: api-image-nginx
    ports:
      - "8094:80"
    volumes:
      - ./src/upload:/usr/share/nginx/html:ro

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-php
    volumes:
      - ./.env:/var/www/.env:ro
      - ./src:/var/www/html
      - ./app:/var/www/app
      - ./vendor:/var/www/vendor
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini:ro

  mysql:
    image: mysql:8.4
    container_name: api-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: api-phpmyadmin
    ports:
      - "8093:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql

  stations-mysql:
    image: mysql:8.4
    container_name: stations-mysql
    environment:
      MYSQL_DATABASE: ${STATIONS_DB_NAME}
      MYSQL_USER: ${STATIONS_DB_USER}
      MYSQL_PASSWORD: ${STATIONS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${STATIONS_DB_ROOT_PASSWORD}
    volumes:
      - stations_data:/var/lib/mysql

  stations-phpmyadmin:
    image: phpmyadmin:latest
    container_name: stations-phpmyadmin
    ports:
      - "8087:80"
    environment:
      PMA_HOST: stations-mysql
      PMA_PORT: 3306
    depends_on:
      - stations-mysql

volumes:
  mysql_data:
  stations_data: